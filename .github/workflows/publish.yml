name: Publish

# Push a commit to main whose message contains `final:publish` (e.g. a merge
# commit, or just `git commit -m "final:publish: ..."`) to build, bump, and
# publish all three packages to npm. Any other commit is a no-op here.
#
# Requires one repo secret: NPM_TOKEN — an npm Automation token (or a
# Granular token with "bypass two-factor auth" enabled), since this account
# has 2FA required on every publish and a normal token can't get past that
# non-interactively. Create one at https://www.npmjs.com/settings/<you>/tokens
# and add it at Settings -> Secrets and variables -> Actions -> New repository
# secret.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'final:publish')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Build
        run: bunx turbo run build

      # All three packages are tightly coupled (config depends on ui,
      # plugin-form-builder depends on both) and always released together
      # from this one monorepo — kept in lockstep rather than tracked
      # independently, same as every publish so far. `workspace:*` internal
      # deps don't need touching here; `bun publish` rewrites those to the
      # real sibling version at publish time.
      - name: Bump versions (patch, all three packages together)
        run: |
          for pkg in ui config plugin-form-builder; do
            (cd "$pkg" && npm version patch --no-git-tag-version)
          done

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/package.json config/package.json plugin-form-builder/package.json
          git commit -m "chore: bump package versions [skip ci]"
          git push

      - name: Publish @baseconfig/ui
        working-directory: ui
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @baseconfig/core
        working-directory: config
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @baseconfig/plugin-form-builder
        working-directory: plugin-form-builder
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
